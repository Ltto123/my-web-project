services:
  blog:
    # ① 从当前目录的 Dockerfile 构建镜像
    build: .

    # ② 端口映射：宿主机:容器
    #    访问 http://localhost:8000 就能看到你的博客
    ports:
      - "8000:8000"

    # ③ 整目录持久化 SQLite 主库及 WAL/SHM；旧目录用于检测尚未升级的数据库。
    volumes:
      - ./data:/app/data           # 主库、WAL、SHM 一起持久化
      - ./:/legacy:ro              # 检测旧库；先运行 scripts/docker-upgrade.py 完成升级
      - ./uploads:/app/uploads      # 用户上传文件持久化
      - ./backend/herb_model_data:/app/backend/herb_model_data  # AI 模型持久化

    # ④ 环境变量（敏感信息通过 .env 传入，非敏感直接写这里）
    env_file:
      - .env                       # DEEPSEEK_API_KEY 等密钥
    environment:
      DATABASE_URL: sqlite:////app/data/blog.db
      LEGACY_DATABASE_PATH: /legacy/blog.db

    # ⑤ 容器挂了自动重启
    restart: unless-stopped
